services:
  mcp-tools:
    build:
      context: ../mcp-tools
      dockerfile: Dockerfile
    image: ai-desk-tools-mcp:latest
    restart: unless-stopped
    command:
      - python
      - server_http.py
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8765"
    ports:
      - "127.0.0.1:8765:8765"
    networks:
      - llm-internal
    security_opt:
      - no-new-privileges:true

