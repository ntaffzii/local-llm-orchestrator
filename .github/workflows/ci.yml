name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      # Without this, ORCHESTRATOR_API_KEY is unset in CI (no .env file is checked in),
      # so require_api_key() runs in its no-auth-configured "open mode" and any key is
      # accepted -- test_models_reject_wrong_api_key then fails with 200 instead of 401.
      ORCHESTRATOR_API_KEY: ci-test-key-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Validate Compose configuration
        run: docker compose --env-file .env.docker.example config --quiet
      - name: Validate configuration syntax
        shell: pwsh
        run: |
          # Validate every model config, not just the default one -- alternate configs
          # like models.main-prompt-only.json are real, tracked deployment options
          # (selected via MODEL_CONFIG_FILE) and must not be able to ship broken JSON.
          Get-ChildItem config/models*.json | ForEach-Object {
            Get-Content $_.FullName -Raw | ConvertFrom-Json | Out-Null
          }
          $tokens = $null
          $errors = @()
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $localErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$localErrors
            )
            $errors += $localErrors
          }
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
